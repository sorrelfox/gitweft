    <circle cx="5" cy="3" r="2.5"/>
    <path d="M5 3h1.5a4.25 4.25 0 0 1 0 8.5H5v-2h1.5a2.25 2.25 0 0 0 0-4.5H5z"/>
    <circle cx="10.5" cy="7.25" r="2.5"/>
    <path fill-rule="evenodd"
          d="M2.5 13a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0zM3.8 13a1.2 1.2 0 1 0 2.4 0a1.2 1.2 0 1 0-2.4 0z"/>
  </g>
</svg>
