# cargo-deny policy. Run: `cargo deny check`
#
# This file is part of Gitweft's offline guarantee (docs/OFFLINE.md): no crate that can
# speak HTTP/TLS or report telemetry may enter the dependency graph. Network access is
# the job of the user's own `git`/`ssh` binaries, never of this process.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
# GPUI's dependency tree carries many unavoidable duplicate versions; not actionable here.
multiple-versions = "allow"
wildcards = "deny"
# Internal `path =` dependencies between our own (unpublished) crates are fine.
allow-wildcard-paths = true
deny = [
    # HTTP clients / servers
    "reqwest", "hyper", "hyper-util", "ureq", "isahc", "curl", "curl-sys", "attohttpc", "surf",
    "h2", "h3", "quinn",
    # TLS stacks
    "rustls", "native-tls", "openssl", "openssl-sys", "tokio-rustls",
    # WebSockets
    "tungstenite", "async-tungstenite",
    # Telemetry, crash reporting, self-updating
    "sentry", "sentry-core", "opentelemetry", "tracing-opentelemetry", "self_update", "posthog-rs",
]
# Note: `gpui-pre-http-client` is allowed on purpose. It only defines HTTP types; it
# contains no client. Gitweft never registers an HTTP client with GPUI (see clippy.toml).

[[bans.features]]
crate = "gix"
deny = [
    "blocking-network-client",
    "async-network-client",
    "async-network-client-async-std",
    "blocking-http-transport-curl",
    "blocking-http-transport-curl-openssl",
    "blocking-http-transport-curl-rustls",
    "blocking-http-transport-reqwest",
    "blocking-http-transport-reqwest-native-tls",
    "blocking-http-transport-reqwest-rust-tls",
    "blocking-http-transport-reqwest-rust-tls-trust-dns",
    "credentials",
]

[licenses]
# Everything here is compatible with distributing the combined work under GPL-3.0-or-later.
# GPL-2.0-only is incompatible and rejected by omission; AGPL is kept out deliberately.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "OFL-1.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9
# The allowlist is a policy (what we would accept), not an inventory of current use.
unused-allowed-license = "allow"

[advisories]
# Advisory DB fetch is the only network use of this *development* tool; builds stay offline.
yanked = "warn"
# Unmaintained transitive crates come from GPUI (instant, paste, rustybuzz, ttf-parser) and
# are tracked upstream; only flag crates we depend on directly.
unmaintained = "workspace"
