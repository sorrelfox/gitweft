[package]
name = "gitweft"
description = "A fast, offline Git client for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
gitweft-core.workspace = true
gitweft-git.workspace = true
gitweft-platform.workspace = true
gitweft-workspace.workspace = true

[build-dependencies]
