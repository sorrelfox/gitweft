# Release builds. A tag `vX.Y.Z` (matching Cargo.toml's version) builds every package with
# the same scripts as `just release` (scripts/dist/, docs/PACKAGING.md), and the macOS disk
# image and the Windows installer and zip with those of `just macos` and `just windows`,
# tests them, and creates a draft GitHub Release with the files and SHA256SUMS to review and
# publish. Each
# package also gets a build provenance attestation, which `gh attestation verify` checks.
# The Release's notes are the version's CHANGELOG.md entry, and the run's "flathub" artifact
# holds the files of the app's Flathub repository for this version (scripts/dist/flathub.sh).
# "Run workflow" (workflow_dispatch) builds and tests without releasing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    name: Sources and notices
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
      - name: Desktop file and metainfo, validated
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq appstream desktop-file-utils
          bash scripts/dist/validate-metadata.sh
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Crates into cargo's cache
        run: cargo fetch --locked
      - name: Tarballs, vendored crates, notices
        run: python3 scripts/dist/sources.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: dist/
          if-no-files-found: error

  reproducible:
    name: Reproducible build
    needs: sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sources, path: dist }
      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfreetype-dev libfontconfig-dev libegl-dev
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Two builds at different paths, compared
        run: bash scripts/dist/repro-check.sh dist target/repro

  # The RPM, the DEB and the AppImage for each architecture, each on a runner of its own
  # (GitHub's arm64 runners for aarch64), so the scripts build natively, as on x86_64.
  rpm:
    name: RPM (Fedora 44, ${{ matrix.arch }})
    needs: sources
    strategy:
      # Each architecture's result counts on its own: one failing doesn't cancel the other.
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sources, path: dist }
      - name: podman
        run: command -v podman || { sudo apt-get update -qq && sudo apt-get install -y -qq podman; }
      - name: Build as COPR does, install, smoke-test offline
        run: |
          bash scripts/dist/rpm.sh dist out/rpm
          # The source RPM is the same for both; the x86_64 run's is the one released.
          [ "${{ matrix.arch }}" = x86_64 ] || rm out/rpm/*.src.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: out/rpm/*.rpm
          if-no-files-found: error

  deb:
    name: DEB (Debian, Ubuntu, ${{ matrix.arch }})
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sources, path: dist }
      - name: podman
        run: command -v podman || { sudo apt-get update -qq && sudo apt-get install -y -qq podman; }
      - name: Build in Ubuntu 24.04
        run: bash scripts/dist/deb.sh dist out/deb
      - name: Install on Debian 13, Ubuntu 24.04 and 26.04, smoke-test offline
        run: bash scripts/dist/test-deb.sh out/deb/gitweft_*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: |
            out/deb/*.deb
            out/deb/gitweft
            out/deb/icons/
            out/deb/lib/
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }})
    needs: [sources, deb]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sources, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: "deb-${{ matrix.arch }}", path: out/deb }
      - name: Pack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools
          command -v podman || sudo apt-get install -y -qq podman
          chmod +x out/deb/gitweft
          bash scripts/dist/appimage.sh out/deb/gitweft dist out/appimage
      - name: Start it where only libxcb and git exist, smoke-test offline
        run: bash scripts/dist/test-appimage.sh out/appimage/Gitweft-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: out/appimage/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak
    needs: sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sources, path: dist }
      - name: flatpak-builder, and Flathub for the SDK and its Rust
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder
          # bwrap needs unprivileged user namespaces, which Ubuntu's AppArmor restricts by
          # default (the same setting ci.yml needs for `unshare -rn`).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build in the SDK, bundle, smoke-test offline
        env:
          GITWEFT_FLATPAK_DEPS: flathub
        run: bash scripts/dist/flatpak.sh dist out/flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: out/flatpak/*.flatpak
          if-no-files-found: error

  # macOS and Windows build from the checkout, not from the tarballs: the vendor tarball
  # holds only stubs of their crates (sources.py). Signing needs the repository's secrets
  # (docs/PACKAGING.md); without them the app is signed ad hoc on macOS and not at all on
  # Windows.
  macos:
    name: macOS (universal)
    # Intel: arm64 runners are often short of capacity, and both slices cross-build anyway.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Developer ID certificate, into a keychain of this run's own
        env:
          CERTIFICATE: ${{ secrets.GITWEFT_MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.GITWEFT_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then echo "No certificate: the app is signed ad hoc."; exit 0; fi
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Build both architectures, sign, pack
        env:
          GITWEFT_MACOS_SIGN_IDENTITY: ${{ secrets.GITWEFT_MACOS_SIGN_IDENTITY }}
          GITWEFT_MACOS_NOTARY_APPLE_ID: ${{ secrets.GITWEFT_MACOS_NOTARY_APPLE_ID }}
          GITWEFT_MACOS_NOTARY_TEAM_ID: ${{ secrets.GITWEFT_MACOS_NOTARY_TEAM_ID }}
          GITWEFT_MACOS_NOTARY_PASSWORD: ${{ secrets.GITWEFT_MACOS_NOTARY_PASSWORD }}
        run: bash scripts/dist/macos.sh out/macos
      - name: From the disk image, both architectures, smoke-test offline
        run: bash scripts/dist/test-macos.sh out/macos/Gitweft-*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/macos/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        # Git for Windows brings bash, which the scripts are written for.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Inno Setup
        run: |
          # The runner image comes with it; if it ever doesn't, the version pins.env names.
          . scripts/dist/pins.env
          [ -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] \
            || choco install innosetup --version "$GITWEFT_PIN_INNO_SETUP_VERSION" --yes --no-progress
      - name: Code-signing certificate
        env:
          CERTIFICATE: ${{ secrets.GITWEFT_WINDOWS_CERTIFICATE }}
        run: |
          if [ -z "$CERTIFICATE" ]; then echo "No certificate: the files stay unsigned."; exit 0; fi
          file=$(cygpath -u "$RUNNER_TEMP")/certificate.pfx
          printf '%s' "$CERTIFICATE" | base64 --decode > "$file"
          echo "GITWEFT_WINDOWS_CERTIFICATE=$file" >> "$GITHUB_ENV"
      - name: Build, sign, pack
        env:
          GITWEFT_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.GITWEFT_WINDOWS_CERTIFICATE_PASSWORD }}
        run: bash scripts/dist/windows.sh out/windows
      - name: Install, smoke-test, uninstall; the zip too
        run: bash scripts/dist/test-windows.sh out/windows/Gitweft-*-setup.exe out/windows/Gitweft-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/windows/*.exe
            out/windows/*.zip
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sources, reproducible, rpm, deb, appimage, flatpak, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # For the attestations: a short-lived signing certificate, and the attestation store.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Files and checksums
        run: |
          mkdir files
          cp artifacts/sources/gitweft-*.tar.xz artifacts/rpm-*/*.rpm artifacts/deb-*/*.deb \
            artifacts/appimage-*/*.AppImage artifacts/flatpak/*.flatpak artifacts/macos/*.dmg \
            artifacts/windows/*.exe artifacts/windows/*.zip files/
          (cd files && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            files/*.tar.xz
            files/*.rpm
            files/*.deb
            files/*.AppImage
            files/*.flatpak
            files/*.dmg
            files/*.exe
            files/*.zip
      - name: Flathub manifest, sources from this Release
        run: bash scripts/dist/flathub.sh files flathub
      - uses: actions/upload-artifact@v4
        with:
          name: flathub
          path: flathub/
          if-no-files-found: error
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/dist/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Gitweft ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
