# `just check` on every push and pull request: formatting, clippy (debug and release),
# cargo-deny, the tests, the offline smoke test and the socket audit (strace).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfreetype-dev libfontconfig-dev libegl-dev just strace
          # The offline smoke test runs in a user namespace (`unshare -rn`), which Ubuntu's
          # AppArmor restricts by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Rust (rust-toolchain.toml, with rustfmt and clippy)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-deny
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: check-${{ runner.os }}-
      - name: cargo-deny
        run: command -v cargo-deny || cargo install --locked cargo-deny
      - name: just check
        run: just check
