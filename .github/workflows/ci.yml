# `just check` on every push and pull request: formatting, clippy (debug and release),
# cargo-deny, the tests, the offline smoke test and the socket audit (strace). macOS and
# Windows get clippy, the tests and the smoke test; the rest of `just check` needs Linux tools.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfreetype-dev libfontconfig-dev libegl-dev just strace
          # The offline smoke test runs in a user namespace (`unshare -rn`), which Ubuntu's
          # AppArmor restricts by default.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Rust (rust-toolchain.toml, with rustfmt and clippy)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin/cargo-deny
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: check-${{ runner.os }}-
      - name: cargo-deny
        run: command -v cargo-deny || cargo install --locked cargo-deny
      - name: just check
        run: just check

  check-mac-win:
    name: check (${{ matrix.os }})
    strategy:
      # Each system's result counts on its own: one failing doesn't cancel the other.
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test would otherwise hold the runner for the default six hours.
    timeout-minutes: 90
    defaults:
      run:
        # Git for Windows brings bash, so every step below is written once.
        shell: bash
    steps:
      # Checkouts on Windows convert to CRLF by default, which would rewrite the sources and
      # the tests' fixtures. Set before the checkout, so it applies to it.
      - name: Keep line endings as they are
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml, with rustfmt and clippy)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: check-${{ runner.os }}-
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast
      # `unshare -rn`, which the Linux job's smoke test runs under, exists only there.
      - name: Offline smoke test
        run: cargo run -p gitweft --locked -- --headless-smoke .
