cli.usage: "Usage: gitweft [--new-instance] [--] [PATH...]\n\nВідкриває Git-репозиторій, що містить кожен PATH, в окремій вкладці (або показує стартовий екран).\nЯкщо Gitweft уже запущено, його вікно відкриває їх і виходить на передній план.\n\nПараметри:\n  --new-instance           Запустити ще один Gitweft замість використання вже запущеного\n  --headless-smoke [PATH]  Завантажити репозиторій без вікна та вивести підсумок\n  --version                Вивести версію\n  -h, --help               Вивести цю довідку\n  --                       Вважати кожен наступний аргумент шляхом PATH, навіть якщо він починається з -\n"
