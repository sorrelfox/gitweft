cli.usage: "用法: gitweft [--new-instance] [--] [PATH...]\n\n在各自的标签页中打开每个 PATH 所在的 Git 仓库（不指定 PATH 时显示启动屏幕）。\n如果 Gitweft 已在运行，将在该窗口中打开它们并前置窗口。\n\n选项:\n  --new-instance           启动新的 Gitweft，而非使用正在运行的实例\n  --headless-smoke [PATH]  不打开窗口，加载仓库并打印摘要\n  --version                打印版本号\n  -h, --help               打印本帮助信息\n  --                       将其后的所有参数都视为 PATH，即使以 - 开头\n"
