cli.usage: "Usage: gitweft [--new-instance] [--] [PATH...]\n\nOtwiera repozytorium Git zawierające każdą ze ścieżek PATH we własnej karcie (albo pokazuje ekran startowy).\nJeśli Gitweft już działa, jego okno je otwiera i wysuwa się na wierzch.\n\nOpcje:\n  --new-instance           Uruchom kolejny Gitweft zamiast używać już działającego\n  --headless-smoke [PATH]  Wczytaj repozytorium bez okna i wypisz podsumowanie\n  --version                Wypisz wersję\n  -h, --help               Wypisz tę pomoc\n  --                       Potraktuj każdy argument po tym jako PATH, nawet jeśli zaczyna się od -\n"
