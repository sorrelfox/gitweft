# A branch dropped on another branch
graph.drop_title:
  en: "%{branch} and %{target}"
graph.drop_text_one:
  en: "%{branch} has %{count} commit that %{target} doesn't have. Merge brings it into %{target} with a merge commit, after switching to %{target}. Rebase copies it on top of %{target} and moves %{branch} there, after switching to %{branch}."
graph.drop_text_other:
  en: "%{branch} has %{count} commits that %{target} doesn't have. Merge brings them into %{target} with a merge commit, after switching to %{target}. Rebase copies them on top of %{target} and moves %{branch} there, after switching to %{branch}; merge commits among them are left out."
graph.drop_text_none:
  en: "%{target} already has every commit of %{branch}, so there's nothing to merge. A rebase moves %{branch} to %{target}, after switching to %{branch}."
graph.drop_text_any:
  en: "Merge brings the commits of %{branch} that %{target} doesn't have into %{target}, after switching to %{target}. Rebase copies them on top of %{target} and moves %{branch} there, after switching to %{branch}."
graph.drop_merge:
  en: "Merge into %{target}"
graph.drop_rebase:
  en: "Rebase onto %{target}"
graph.drop_rebase_merges:
  en: "Rebase, keeping merges"
graph.drop_merges_note_one:
  en: "%{count} of them is a merge commit: a plain rebase leaves it out, rebasing while keeping merges makes it again."
graph.drop_merges_note_other:
  en: "%{count} of them are merge commits: a plain rebase leaves them out, rebasing while keeping merges makes them again."
graph.drop_pick_group:
  en: Drop onto
graph.drop_pick_target:
  en: "%{branch} onto %{target}…"
