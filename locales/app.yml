_version: 2

# All user-visible strings. Keys are namespaced by area; `%{name}` are placeholders.

cli.usage:
  en: |
    Usage: gitweft [--new-instance] [--] [PATH...]

    Opens the Git repository containing each PATH in its own tab (or shows the start screen).
    When Gitweft is running already, its window opens them and comes forward.

    Options:
      --new-instance           Start another Gitweft instead of using the one running
      --headless-smoke [PATH]  Load the repository without a window and print a summary
      --version                Print version
      -h, --help               Print this help
      --                       Take every argument after it as a PATH, even one starting with -
cli.unknown_option:
  en: "gitweft: unknown option %{flag} (a path that starts with - goes after --)"
