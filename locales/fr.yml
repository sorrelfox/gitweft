cli.usage: "Usage: gitweft [--new-instance] [--] [PATH...]\n\nOuvre le dépôt Git contenant chaque PATH dans son propre onglet (ou affiche l'écran de démarrage).\nSi Gitweft est déjà lancé, sa fenêtre les ouvre et passe au premier plan.\n\nOptions :\n  --new-instance           Démarre un autre Gitweft au lieu d'utiliser celui qui est déjà lancé\n  --headless-smoke [PATH]  Charge le dépôt sans fenêtre et affiche un résumé\n  --version                Affiche la version\n  -h, --help               Affiche cette aide\n  --                       Prend chaque argument suivant comme PATH, même s'il commence par -\n"
