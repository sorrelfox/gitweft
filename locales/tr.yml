cli.usage: "Kullanım: gitweft [--new-instance] [--] [PATH...]\n\nHer PATH için, içindeki Git deposunu kendi sekmesinde açar (ya da başlangıç ekranını gösterir).\nGitweft zaten çalışıyorsa penceresi onları açar ve öne gelir.\n\nSeçenekler:\n  --new-instance           Çalışanı kullanmak yerine başka bir Gitweft başlatır\n  --headless-smoke [PATH]  Depoyu pencere açmadan yükler ve bir özet yazdırır\n  --version                Sürümü yazdırır\n  -h, --help               Bu yardımı yazdırır\n  --                       Ondan sonraki her argümanı, - ile başlasa bile PATH olarak alır\n"
