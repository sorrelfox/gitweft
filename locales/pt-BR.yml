cli.usage: "Usage: gitweft [--new-instance] [--] [PATH...]\n\nAbre o repositório Git de cada PATH em sua própria aba (ou mostra a tela inicial).\nQuando o Gitweft já está em execução, sua janela os abre e vem para frente.\n\nOpções:\n  --new-instance           Inicia outro Gitweft em vez de usar o que já está em execução\n  --headless-smoke [PATH]  Carrega o repositório sem abrir janela e imprime um resumo\n  --version                Imprime a versão\n  -h, --help                Imprime esta ajuda\n  --                       Trata todo argumento após ele como um PATH, mesmo que comece com -\n"
