# German: locales/app.yml translated. Every key of app.yml, with this language's
# plural forms; checked by crates/gitweft-workspace/tests/locale_keys.rs.

cli.usage: "Usage: gitweft [--new-instance] [--] [PATH...]\n\nÖffnet das Git-Repository, das jeden PATH enthält, in einem eigenen Tab (oder zeigt den Startbildschirm).\nWenn Gitweft bereits läuft, öffnet dessen Fenster sie und tritt in den Vordergrund.\n\nOptionen:\n  --new-instance           Startet ein weiteres Gitweft, statt das laufende zu verwenden\n  --headless-smoke [PATH]  Lädt das Repository ohne Fenster und gibt eine Zusammenfassung aus\n  --version                Gibt die Version aus\n  -h, --help               Gibt diese Hilfe aus\n  --                       Behandelt jedes folgende Argument als PATH, auch wenn es mit - beginnt\n"
cli.unknown_option: "gitweft: unbekannte Option %{flag} (ein Pfad, der mit - beginnt, gehört hinter --)"
