cli.usage: "Usage: gitweft [--new-instance] [--] [PATH...]\n\nAbre el repositorio Git que contiene cada PATH en su propia pestaña (o muestra la pantalla de inicio).\nSi Gitweft ya se está ejecutando, su ventana los abre y la trae al frente.\n\nOpciones:\n  --new-instance           Iniciar otro Gitweft en lugar de usar el que ya se está ejecutando\n  --headless-smoke [PATH]  Cargar el repositorio sin ventana e imprimir un resumen\n  --version                Imprimir la versión\n  -h, --help               Imprimir esta ayuda\n  --                       Tomar cada argumento después de esto como un PATH, incluso si empieza con -\n"
