cli.usage: "使用法: gitweft [--new-instance] [--] [PATH...]\n\n各 PATH を含む Git リポジトリをそれぞれ独立したタブで開きます(PATH がなければスタート画面を表示します)。\nGitweft がすでに起動している場合は、そのウィンドウで開いて前面に表示します。\n\nオプション:\n  --new-instance           起動中のものを使わず、別の Gitweft を起動します\n  --headless-smoke [PATH]  ウィンドウを開かずにリポジトリを読み込み、概要を表示します\n  --version                バージョンを表示します\n  -h, --help               このヘルプを表示します\n  --                       これ以降の引数を、- で始まるものも含めてすべて PATH として扱います\n"
