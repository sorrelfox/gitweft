cli.usage: "Uso: gitweft [--new-instance] [--] [PATH...]\n\nApre il repository Git che contiene ciascun PATH nella propria scheda (o mostra la schermata iniziale).\nSe Gitweft è già in esecuzione, la sua finestra li apre e viene portata in primo piano.\n\nOpzioni:\n  --new-instance           Avvia un altro Gitweft invece di usare quello già in esecuzione\n  --headless-smoke [PATH]  Carica il repository senza finestra e stampa un riepilogo\n  --version                Stampa la versione\n  -h, --help               Stampa questo aiuto\n  --                       Considera ogni argomento successivo come un PATH, anche se inizia con -\n"
cli.unknown_option: "gitweft: opzione sconosciuta %{flag} (un percorso che inizia con - va dopo --)"
