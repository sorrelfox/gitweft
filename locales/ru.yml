cli.usage: "Usage: gitweft [--new-instance] [--] [PATH...]\n\nОткрывает репозиторий Git, содержащий каждый PATH, в отдельной вкладке (или показывает стартовый экран).\nЕсли Gitweft уже запущен, его окно открывает их и выходит на передний план.\n\nOptions:\n  --new-instance           Запустить ещё один экземпляр Gitweft вместо использования уже запущенного\n  --headless-smoke [PATH]  Загрузить репозиторий без окна и вывести сводку\n  --version                Вывести версию\n  -h, --help               Вывести эту справку\n  --                       Считать каждый следующий аргумент PATH, даже начинающийся с -\n"
cli.unknown_option: "gitweft: неизвестный параметр %{flag} (путь, начинающийся с -, указывается после --)"
cli.no_answer: "gitweft: Gitweft уже запущен, но не отвечает (%{error}), поэтому запускается ещё один экземпляр."
